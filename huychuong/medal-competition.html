<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">
<title>Giải đấu</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css?v=2">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:#eef3fb;
  font-family:"Roboto Condensed", Arial, sans-serif;
  color:#111827;
}

.page{
  width:100%;
  margin-top:22px;
}

.card{
  width:95%;
  min-height:52px;
  margin:0 auto 10px;
  background:#ffffff;
  border-radius:12px;
  border:1px solid #d9e2ee;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 14px;
  text-decoration:none;
  color:#1d4ed8;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

.main{
  font-size:14px;
  font-weight:800;
  line-height:18px;
}

.sub{
  font-size:14px;
  color:#666;
  margin-top:2px;
  line-height:18px;
}

.arrow{
  font-size:22px;
  color:#777;
}

.loading,
.empty{
  text-align:center;
  padding:20px;
  color:#555;
  font-size:14px;
}
</style>
</head>

<body class="no-tabs doc-page">

<header class="page-header">
  <div class="page-header-inner">

    <a href="javascript:history.back()" class="page-back">
      ← Quay lại
    </a>

    <div class="page-title-wrap">
      <div class="page-title">
        Giải đấu
      </div>
    </div>

  </div>
</header>

<div class="page" id="list">
  <div class="loading">Đang tải...</div>
</div>

<script>
const SHEET_ID = "1MATLspvOeL4MFObWUIiYqjKkw-PkEEQ7IqXCw-kRheQ";
const GID = "1558133737";
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

const params = new URLSearchParams(location.search);
const selectedYear = params.get("year") || "";

function splitCSVRow(row){
  const result=[]; 
  let current=""; 
  let inQuotes=false;

  for(let i=0;i<row.length;i++){
    const char=row[i];
    const next=row[i+1];

    if(char === '"' && inQuotes && next === '"'){
      current+='"';
      i++;
    }else if(char === '"'){
      inQuotes=!inQuotes;
    }else if(char === "," && !inQuotes){
      result.push(current);
      current="";
    }else{
      current+=char;
    }
  }

  result.push(current);
  return result.map(v=>v.trim());
}

function parseCSV(text){
  return text
    .replace(/\r/g,"")
    .split("\n")
    .filter(r=>r.trim()!=="")
    .map(splitCSVRow);
}

function clean(v){
  return String(v || "").trim();
}

fetch(CSV_URL)
.then(res=>res.text())
.then(text=>{
  const rows=parseCSV(text).slice(2);
  const map=new Map();

  rows.forEach(r=>{
    const year=clean(r[0]);   // A
    const time=clean(r[1]);   // B
    const name=clean(r[3]);   // D

    if(year !== selectedYear || !name) return;

const nameLower = name.toLowerCase();

if(
  nameLower.includes("tuần") ||
  nameLower.includes("tuan") ||
  nameLower.includes("học") ||
  nameLower.includes("hoc") ||
  nameLower.includes("hà nội") ||
  nameLower.includes("ha noi")
) return;

    const key = `${name}__${time}`;
    if(!map.has(key)){
      map.set(key,{year,time,name});
    }
  });

  const competitions=[...map.values()];
  const list=document.getElementById("list");

  if(competitions.length===0){
    list.innerHTML=`<div class="empty">Không có dữ liệu</div>`;
    return;
  }

  list.innerHTML=competitions.map(c=>`
    <a class="card"
       href="medal-ranking.html?year=${encodeURIComponent(c.year)}&competition=${encodeURIComponent(c.name)}&time=${encodeURIComponent(c.time)}">
      <div>
        <div class="main">${c.name}</div>
        <div class="sub">${c.time}</div>
      </div>
      <div class="arrow"></div>
    </a>
  `).join("");
})
.catch(err=>{
  document.getElementById("list").innerHTML=`<div class="empty">Lỗi tải dữ liệu</div>`;
  console.error(err);
});
</script>

<script>
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());
</script>

</body>
</html>
