<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">
<title>Tin tức</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#f3f3f3;
  font-family:"Roboto Condensed", Arial, sans-serif;
  color:#111827;
  font-size:14px;
}

/* =========================
   LIST
========================= */

.container{
  padding:70px 0 30px;
  background:#f3f3f3;
}

.news-item{
  display:flex;
  gap:14px;
  padding:16px 14px;
  text-decoration:none;
  color:inherit;
  position:relative;
}

.news-item::after{
  content:"";
  position:absolute;
  left:128px;
  right:14px;
  bottom:0;
  height:1px;
  background:#dddddd;
}

.thumb{
  width:92px;
  height:92px;
  border-radius:16px;
  overflow:hidden;
  flex-shrink:0;
  background:#e5e7eb;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.info{
  flex:1;
  min-width:0;
  padding-top:2px;
}

.date{
  font-size:14px;
  color:#8d8d93;
  line-height:1.1;
  margin-bottom:6px;
  font-weight:500;
}

.title{
  font-size:14px;
  line-height:1.15;
  color:#000;
  font-weight:700;

  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.loading{
  text-align:center;
  color:#777;
  padding:40px 20px;
  font-size:14px;
}
</style>
</head>

<body>
<header class="page-header">
  <div class="page-header-inner">

    <a href="index.html" class="page-back">
      ← Quay lại
    </a>

    <div class="page-title-wrap">
      <div class="page-title">
        Tin tức
      </div>
    </div>

  </div>
</header>

<div class="container" id="newsList">
  <div class="loading">Đang tải tin tức...</div>
</div>

<script>
const url =
"https://docs.google.com/spreadsheets/d/1dY2xP9LB2jeMeneAY0anZQrMlMtnV7za_C18Slw1tJ8/export?format=csv&gid=823135258";

/* =========================
   CSV
========================= */
function splitCSVRow(row) {
  const result = [];
  let current = "";
  let inQuotes = false;

  for (let i = 0; i < row.length; i++) {
    const char = row[i];
    const next = row[i + 1];

    if (char === '"' && inQuotes && next === '"') {
      current += '"';
      i++;
    } else if (char === '"') {
      inQuotes = !inQuotes;
    } else if (char === "," && !inQuotes) {
      result.push(current.trim());
      current = "";
    } else {
      current += char;
    }
  }

  result.push(current.trim());
  return result;
}

function cleanText(value){
  return (value || "")
    .replace(/^"|"$/g, "")
    .trim();
}

/* =========================
   DRIVE IMAGE
========================= */
function convertDrive(link){
  if(!link) return "";

  const match1 = link.match(/\/file\/d\/([^/]+)/);

  if(match1){
    return `https://drive.google.com/thumbnail?id=${match1[1]}&sz=w1200`;
  }

  const match2 = link.match(/[?&]id=([^&]+)/);

  if(match2){
    return `https://drive.google.com/thumbnail?id=${match2[1]}&sz=w1200`;
  }

  return link;
}

/* =========================
   LOAD
========================= */
fetch(url + "&t=" + Date.now())
.then(res => res.text())
.then(text => {
  const rows = text.split(/\r?\n/).slice(1);
  const container = document.getElementById("newsList");

  container.innerHTML = "";

  rows.forEach(row => {
    if (!row.trim()) return;

    const cols = splitCSVRow(row);

    const title = cleanText(cols[0]);
    const date  = cleanText(cols[1]);
    const link  = cleanText(cols[2]);
    const image = cleanText(cols[3]);

    if(!title) return;

    const item = document.createElement("a");
    item.className = "news-item";

    item.href = link
      ? `viewer.html?url=${encodeURIComponent(link)}`
      : "#";

    item.innerHTML = `
      <div class="thumb">
        ${
          image
          ? `<img src="${convertDrive(image)}"
                 onerror="this.style.display='none'">`
          : ""
        }
      </div>

      <div class="info">
        <div class="date">${date}</div>
        <div class="title">${title}</div>
      </div>
    `;

    container.appendChild(item);
  });

  if(container.innerHTML.trim() === ""){
    container.innerHTML =
      `<div class="loading">Chưa có tin tức</div>`;
  }
})
.catch(() => {
  document.getElementById("newsList").innerHTML =
    `<div class="loading">Không tải được tin tức</div>`;
});
</script>

<script>
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());
</script>

</body>
</html>
