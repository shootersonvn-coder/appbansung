<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<title>Quản trị</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../style.css?v=2">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:#eef3fb;
  font-family:"Roboto Condensed", Arial, sans-serif;
  color:#111827;
}

.page{
  width:100%;
  margin-top:22px;/*Thay đổi độ cao của các card*/
  padding-bottom:24px;
  
}

.doc-card{
  width:95%;
  height:40px;
  margin:0 auto 10px;
  background:#ffffff;
  border-radius:12px;
  border:1px solid #d9e2ee;
  display:flex;
  align-items:center;
  padding:0 14px;
  font-size:14px;
  font-weight:500;
  color:#1d4ed8;
  text-decoration:none;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

button.doc-card{
  font-family:"Roboto Condensed", Arial, sans-serif;
  cursor:pointer;
  text-align:left;
}

.doc-card:active{
  transform:scale(0.995);
}

.bottom-space{
  height:20px;
}
</style>
</head>

<body class="no-tabs doc-page">

<header class="page-header">
  <div class="page-header-inner">

    <a href="../index.html" class="page-back">
      ← Quay lại
    </a>

    <div class="page-title-wrap">
      <div class="page-title">Quản trị</div>
    </div>

  </div>
</header>

<div class="page">

 
    <a class="doc-card" href="../score-input.html">
  Nhập điểm tiêu chuẩn
</a>
  <div class="doc-card">Nhập Chung kết (Sắp triển khai)</div>
  <div class="doc-card">Đăng ký thi đấu</div>
  <div class="doc-card">Sắp triển khai</div>
  
  <div class="doc-card">Chờ</div>

  <div class="bottom-space"></div>
</div>

<script>
function openScore(){
  window.location.href = "../score.html";
}

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());
</script>

</body>
</html>
