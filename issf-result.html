<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>ISSF Result</title>

<style>
body{
  margin:0;
  background:#eef3fb;
  font-family:Arial,sans-serif;
  color:#111;
}

h3{
  margin:0;
  padding:12px 14px;
  font-size:20px;
  font-weight:700;
}

.table-wrap{
  width:100%;
  overflow:auto;
  padding:0 10px 20px;
}

table{
  border-collapse:collapse;
  width:100%;
  table-layout:fixed;
  background:#fff;
}

th{
  background:#0b5d2a;
  color:#fff;
  font-size:14px;
  padding:8px;
  border:1px solid #d8dde5;
  white-space:nowrap;
}

th,td{
  overflow:hidden;
  text-overflow:ellipsis;
}

th:nth-child(1),td:nth-child(1){width:45px;}
th:nth-child(2),td:nth-child(2){width:55px;}
th:nth-child(3),td:nth-child(3){width:180px;}
th:nth-child(4),td:nth-child(4){width:45px;}
th:nth-child(n+5),td:nth-child(n+5){width:60px;}

td{
  font-size:14px;
  padding:6px 8px;
  border:1px solid #d8dde5;
  white-space:nowrap;
}

tr:nth-child(even){
  background:#f7f9fc;
}

td:nth-child(1),
td:nth-child(2),
td:nth-child(4){
  text-align:center;
}

td:nth-child(11){
  font-weight:700;
}
</style>
</head>

<body>

<h3 id="title">Đang tải ISSF...</h3>

<div class="table-wrap">
<table>
  <thead>
    <tr>
      <th>Hạng</th>
      <th>Bib</th>
      <th>VĐV</th>
      <th>QG</th>
      <th>1</th>
      <th>2</th>
      <th>3</th>
      <th>4</th>
      <th>5</th>
      <th>6</th>
      <th>Tổng</th>
      <th>Ghi chú</th>
    </tr>
  </thead>

  <tbody id="body"></tbody>
</table>
</div>

<script>
const ISSF_URL = "https://www.issf-sports.org/competitions/3284/results/3b3b303b41524d3b313b513b493b313b303b30";

const PROXY =
  "/api/issf?url=" + encodeURIComponent(ISSF_URL);

async function loadISSF(){

  const html =
    await fetch(PROXY).then(r => r.text());

  const doc =
    new DOMParser().parseFromString(html, "text/html");

  document.getElementById("title").textContent =
    "10m Air Rifle Men - Qualification";

  const rows = [];

  const tables = [...doc.querySelectorAll("table")];

const table = tables.find(t =>
  t.innerText.includes("Rank") &&
  t.innerText.includes("Total")
);

  const trs =
    table
      ? [...table.querySelectorAll("tr")]
      : [];

  trs.forEach(tr => {

    const tds =
      [...tr.querySelectorAll("td")];

    if(tds.length < 11) return;

    rows.push({
      rank: tds[0]?.innerText.trim() || "",
      bib: tds[1]?.innerText.trim() || "",
      name: tds[2]?.innerText.trim() || "",
      noc: tds[3]?.innerText.trim() || "",
      s1: tds[4]?.innerText.trim() || "",
      s2: tds[5]?.innerText.trim() || "",
      s3: tds[6]?.innerText.trim() || "",
      s4: tds[7]?.innerText.trim() || "",
      s5: tds[8]?.innerText.trim() || "",
      s6: tds[9]?.innerText.trim() || "",
      total: tds[10]?.innerText.trim() || "",
      note: tds[11]?.innerText.trim() || ""
    });

  });

  document.getElementById("body").innerHTML =
    rows.map(r => `
      <tr>
        <td>${r.rank}</td>
        <td>${r.bib}</td>
        <td>${r.name}</td>
        <td>${r.noc}</td>
        <td>${r.s1}</td>
        <td>${r.s2}</td>
        <td>${r.s3}</td>
        <td>${r.s4}</td>
        <td>${r.s5}</td>
        <td>${r.s6}</td>
        <td>${r.total}</td>
        <td>${r.note}</td>
      </tr>
    `).join("");

}

loadISSF();
</script>

</body>
</html>
