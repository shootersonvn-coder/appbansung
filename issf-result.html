<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>ISSF Result</title>
</head>
<body>

<h3 id="title">Đang tải ISSF...</h3>
<table border="1" cellpadding="6">
  <thead>
    <tr>
      <th>Hạng</th>
      <th>Bib</th>
      <th>VĐV</th>
      <th>QG</th>
      <th>1</th>
      <th>2</th>
      <th>3</th>
      <th>4</th>
      <th>5</th>
      <th>6</th>
      <th>Tổng</th>
      <th>Ghi chú</th>
    </tr>
  </thead>
  <tbody id="body"></tbody>
</table>

<script>
const ISSF_URL = "https://www.issf-sports.org/competitions/3284/results/3b3b303b41524d3b313b513b493b313b303b30";
const PROXY = "/api/issf?url=" + encodeURIComponent(ISSF_URL);

async function loadISSF(){
  const html = await fetch(PROXY).then(r => r.text());
  const doc = new DOMParser().parseFromString(html, "text/html");

  document.getElementById("title").textContent =
    doc.body.innerText.match(/10m Air Rifle Men[\s\S]*?Qualification/)?.[0]
      .replace(/\s+/g, " - ")
      || "ISSF Result";

  const rows = [];

const table = doc.querySelector("table");
const trs = table ? [...table.querySelectorAll("tr")] : [];

trs.forEach(tr => {
  const tds = [...tr.querySelectorAll("td")];

  if (tds.length < 11) return;

  rows.push({
    rank: tds[0]?.innerText.trim() || "",
    bib: tds[1]?.innerText.trim() || "",
    name: tds[2]?.innerText.trim() || "",
    noc: tds[3]?.innerText.trim() || "",
    s1: tds[4]?.innerText.trim() || "",
    s2: tds[5]?.innerText.trim() || "",
    s3: tds[6]?.innerText.trim() || "",
    s4: tds[7]?.innerText.trim() || "",
    s5: tds[8]?.innerText.trim() || "",
    s6: tds[9]?.innerText.trim() || "",
    total: tds[10]?.innerText.trim() || "",
    note: tds[11]?.innerText.trim() || ""
  });
});

    
  }

  document.getElementById("body").innerHTML = rows.map(r => `
    <tr>
      <td>${r.rank}</td>
      <td>${r.bib}</td>
      <td>${r.name}</td>
      <td>${r.noc}</td>
      <td>${r.s1}</td>
      <td>${r.s2}</td>
      <td>${r.s3}</td>
      <td>${r.s4}</td>
      <td>${r.s5}</td>
      <td>${r.s6}</td>
      <td><b>${r.total}</b></td>
      <td>${r.note}</td>
    </tr>
  `).join("");
}

loadISSF();
</script>

</body>
</html>
