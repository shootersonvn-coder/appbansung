<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>ISSF Results</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#eef3fb;
  font-family:Arial,sans-serif;
  color:#111;
}

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:#0b5d2a;
  color:#fff;
  padding:14px;
  font-size:20px;
  font-weight:700;
}

.list{
  padding:10px 0 30px;
}

.card{
  width:95%;
  margin:0 auto 10px;
  background:#fff;
  border-radius:14px;
  border:1px solid #d8dde5;
  padding:14px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

.card:active{
  opacity:.7;
}
</style>
</head>

<body>

<div class="header">
  ISSF Results
</div>

<div class="list">

  <div class="card"
onclick="openISSF(
'https://www.issf-sports.org/competitions/3284/results/3b3b303b41524d3b313b513b493b313b303b30',
'10m Air Rifle Men'
)">
  10m Air Rifle Men
</div>

  <div class="card"
onclick="openISSF(
'https://www.issf-sports.org/competitions/3284/results/3b3b303b41524d3b313b513b493b313b303b30',
'10m Air Pistol Men'
)">
  10m Air Pistol Men
</div>

</div>

<script>
function openISSF(url, title){

  location.href =
    "issf-result.html?url=" +
    encodeURIComponent(url) +
    "&title=" +
    encodeURIComponent(title);

}
</script>

</body>
</html>
