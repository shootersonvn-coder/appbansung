<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Thành tích VĐV</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css?v=2">

<style>
:root{
  --bg:#eef3fb;
  --card:#ffffff;
  --green:#005f37;
  --blue:#294b96;
  --line:#d8dde5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  font-family:"Roboto Condensed",Arial,sans-serif;
  color:#111827;
  font-size:14px;
}

.page-header{
  position:sticky;
  top:0;
  z-index:1000;
}
.page{padding:10px 0 30px;}
.info-card{
  position:sticky;
  top:70px;
  z-index:900;

  width:95%;
  margin:0 auto 8px;
  background:#fff;
  border-radius:18px;
  padding:14px;
}
.info-title{
  font-size:14px;
  font-weight:800;
  line-height:1.3;
}
.info-sub{
  margin-top:4px;
  color:#666;
  font-size:14px;
  font-weight:600;
}
.result-list{
  width:95%;
  margin:0 auto;
  display:grid;
  gap:8px;
}
.result-card{
  background:#fff;
  border:none;
  border-radius:18px;
  padding:14px;
  text-align:left;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}
.result-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  font-size:14px;
  font-weight:800;
  line-height:1.4;
}
.result-time{
  color:#3b82f6;
  font-weight:800;
}
.result-score{
  color:#3b82f6;
  font-weight:800;
  white-space:nowrap;
}
.result-sub{
  margin-top:6px;
  font-size:14px;
  color:#666;
  font-weight:600;
  line-height:1.4;
}
.result-detail{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid #e5e7eb;
  display:none;
}
.result-detail.show{display:block;}
.detail-line{
  margin-top:4px;
  font-size:14px;
  line-height:1.4;
}
.loading{
  padding:40px 16px;
  text-align:center;
  color:#294b96;
  font-weight:700;
}
.info-sub + .info-sub{
  margin-top:2px;
}
.total-line{
  font-weight:800;
}
.medal-cn{
  font-size:14px;
  vertical-align:middle;
}

.medal-team{
  font-size:24px;
  vertical-align:middle;
}
</style>
</head>

<body>

<header class="page-header">
  <div class="page-header-inner">
    <button class="page-back page-back-button" onclick="history.back()">← Quay lại</button>

    <div class="page-title-wrap">
      <div class="page-title">Thành tích</div>
      <div class="page-subtitle">Tra cứu VĐV</div>
    </div>
  </div>
</header>

<div class="page">
  <div class="info-card">
    <div id="eventTitle" class="info-title">Đang tải...</div>
    <div id="athleteId" class="info-sub"></div>

<div id="eventSub"
     class="info-sub"></div>
  </div>

  <div id="resultList" class="result-list">
    <div class="loading">Hãy đợi một lát . . .</div>
  </div>
</div>

<script>
const SHEET_ID =
  "1MATLspvOeL4MFObWUIiYqjKkw-PkEEQ7IqXCw-kRheQ";

const SHEET_GID =
  "1558133737";

const CSV_URL =
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${SHEET_GID}`;

const params =
  new URLSearchParams(window.location.search);

const athleteIdParam =
  decodeURIComponent(params.get("id") || "");

let athleteFullNameParam =
  decodeURIComponent(params.get("name") || "");

const eventName =
  decodeURIComponent(params.get("event") || "");

if(
  athleteFullNameParam === "[object HTMLDivElement]" ||
  athleteFullNameParam === "[object Object]"
){
  athleteFullNameParam = "";
}

const COL_COMPETITION = 3;
const COL_TIME = 4;
const COL_EVENT = 5;
const COL_ID = 10;
const COL_HO = 11;
const COL_TEN = 12;
const COL_TOTAL = 32;
const COL_AA = 26;
const COL_AB = 27;
const COL_AC = 28;
const COL_AD = 29;
const COL_AE = 30;
const COL_10 = 17;
const COL_20 = 18;
const COL_30 = 19;
const COL_40 = 20;
const COL_50 = 21;
const COL_60 = 22;
const COL_X  = 23;

function splitCSVRow(row){
  const result = [];
  let current = "";
  let insideQuotes = false;

  for(let i=0;i<row.length;i++){
    const char = row[i];
    const next = row[i+1];

    if(char === '"'){
      if(insideQuotes && next === '"'){
        current += '"';
        i++;
      }else{
        insideQuotes = !insideQuotes;
      }
    }else if(char === "," && !insideQuotes){
      result.push(current.trim());
      current = "";
    }else{
      current += char;
    }
  }

  result.push(current.trim());
  return result;
}

function clean(v){
  return String(v || "").trim();
}

function parseDate(text){
  const m =
    clean(text).match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);

  if(!m) return null;

  const dd = m[1].padStart(2,"0");
  const mm = m[2].padStart(2,"0");
  const yyyy = m[3];

  return new Date(`${yyyy}-${mm}-${dd}T00:00:00`);
}

function dateOnly(v){
  const s = clean(v);
  const m = s.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if(!m) return s;
  return `${m[1].padStart(2,"0")}.${m[2].padStart(2,"0")}.${m[3]}`;
}

function medalText(v,type="cn"){

  const t = clean(v).toUpperCase();

  let out = "";

  const cls =
    type === "team"
      ? "medal-team"
      : "medal-cn";

  if(t.includes("V")){
    out += `<span class="${cls}">🥇</span>`;
  }

  if(t.includes("B")){
    out += `<span class="${cls}">🥈</span>`;
  }

  if(t.includes("D") || t.includes("Đ")){
    out += `<span class="${cls}">🥉</span>`;
  }

  return out;
}

function recordText(v){
  return clean(v).toUpperCase().includes("KL") ? "💥" : "";
}

function formatScore(score,event){

  let s = clean(score);

  if(isDecimalEvent(event)){

    if(!s.includes(",")){
      s += ",0";
    }

    return s;
  }

  return s.replace(",0","");
}
function isDecimalEvent(event){

  const t = clean(event).toLowerCase();

  // 🔹 Súng ngắn luôn là số nguyên
  if(
    t.includes("súng ngắn") ||
    t.includes("sung ngan")
  ){
    return false;
  }

  // 🔹 3 tư thế là số nguyên
  if(
    t.includes("3 tư thế") ||
    t.includes("3 tu the")
  ){
    return false;
  }

  // 🔹 Nội dung nằm + súng trường hơi là thập phân
  return (
    t.includes("súng trường hơi") ||
    t.includes("sung truong hoi") ||
    t.includes("nằm") ||
    t.includes("nam")
  ) && !t.includes("di động") && !t.includes("di dong");
}

function formatPoint(v,event){
  const s = clean(v);
  if(!s) return "";

  const n = Number(
    s.replace(/\./g,"").replace(",",".")
  );

  if(isNaN(n)) return s;

  if(isDecimalEvent(event)){
    return n.toFixed(1).replace(".",",");
  }

  return String(Math.round(n));
}

async function load(){
  let athleteFullName = athleteFullNameParam;

  document.getElementById("eventTitle").innerText =
  athleteFullNameParam || "Đang tải...";

document.getElementById("athleteId").innerText =
  athleteIdParam;

document.getElementById("eventSub").innerText =
  eventName;

  try{
    const res =
      await fetch(CSV_URL + "&t=" + Date.now(),{
        cache:"no-store"
      });

    const text =
      await res.text();

    const rows =
      text
      .replace(/^\uFEFF/, "")
      .split(/\r?\n/)
      .filter(r => r.trim())
      .map(splitCSVRow);

    const results = [];

    rows.slice(1).forEach(r => {
      const id = clean(r[COL_ID]);
      if(id !== athleteIdParam) return;

      const event = clean(r[COL_EVENT]);
      if(event !== eventName) return;

      if(!athleteFullName){
        const ho = clean(r[COL_HO]);
        const ten = clean(r[COL_TEN]);
        athleteFullName = `${ho} ${ten}`.trim();
      }

      const dateText = dateOnly(r[COL_TIME]);
      const d = parseDate(dateText);
      const score = clean(r[COL_TOTAL]);

      results.push({
        date: dateText,
        score: formatScore(score,eventName),
        s10: formatPoint(r[COL_10], eventName),
s20: formatPoint(r[COL_20], eventName),
s30: formatPoint(r[COL_30], eventName),
s40: formatPoint(r[COL_40], eventName),
s50: formatPoint(r[COL_50], eventName),
s60: formatPoint(r[COL_60], eventName),
x: clean(r[COL_X]),
        competition: clean(r[COL_COMPETITION]),
        medalCN: medalText(r[COL_AD],"cn"),

medalTeam: medalText(r[COL_AE],"team"),

medalDoi:
  medalText(r[COL_AC],"team")
            ? medalText(r[COL_AC]) + "D"
            : "",
        record:
          recordText(r[COL_AA]) ||
          recordText(r[COL_AB]) ||
          recordText(r[COL_AC]),
        sort: d ? d.getTime() : 0
      });
    });

    document.getElementById("eventTitle").innerText =
      athleteFullName || eventName;

    results.sort((a,b) => b.sort - a.sort);

    render(results);

  }catch(err){
    console.error(err);

    document.getElementById("resultList").innerHTML = `
      <div class="loading">
        Không tải được dữ liệu
      </div>
    `;
  }
}

function render(results){
  const list =
    document.getElementById("resultList");

  if(!results.length){
    list.innerHTML = `
      <div class="loading">
        Chưa có thành tích
      </div>
    `;
    return;
  }

  list.innerHTML =
    results.map((r,index) => `
      <button class="result-card" onclick="toggleDetail(${index})">

        <div class="result-top">
          <div class="result-time">
            ${r.date}
          </div>

          <div class="result-score">
            ${r.medalCN || ""}
            ${r.medalTeam || ""}
            ${r.medalDoi || ""}
            ${r.record || ""}
            ${r.score}
          </div>
        </div>

        <div class="result-sub">
          ${r.competition || ""}
        </div>

        <div class="result-detail" id="detail-${index}">
          <div class="detail-line">
  ${r.s10 || ""} &nbsp;
  ${r.s20 || ""} &nbsp;
  ${r.s30 || ""}
</div>

<div class="detail-line">
  ${r.s40 || ""} &nbsp;
  ${r.s50 || ""} &nbsp;
  ${r.s60 || ""}

  <span style="float:right;font-weight:400">
  ${r.x ? "x: " + r.x : ""}
</span>
</div>
        </div>

      </button>
    `).join("");
}

function toggleDetail(index){
  const current =
    document.getElementById("detail-" + index);

  document
    .querySelectorAll(".result-detail.show")
    .forEach(el => {
      if(el !== current){
        el.classList.remove("show");
      }
    });

  current.classList.toggle("show");
}

load();
</script>

</body>
</html>
