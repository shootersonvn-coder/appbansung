function withRefreshParam(url){
  if(!url) return url;
  const joiner = url.includes("?") ? "&" : "?";
  return `${url}${joiner}app_refresh=${Date.now()}`;
}

function renderTaiLieu(){
  const list = document.getElementById("docsList");

  if(!taiLieuLinks.length){
    list.innerHTML = `<div class="doc-empty">Chưa có tài liệu.</div>`;
    return;
  }

  list.innerHTML = taiLieuLinks.map((item,index)=>`
    <button
      class="doc-item-btn"
      type="button"
      onclick="openTaiLieuLink(${index})"
    >
      <div class="doc-item-title">${item.title}</div>
      <div class="doc-item-arrow">›</div>
    </button>
  `).join("");
}

function openTaiLieuLink(index){
  const item = taiLieuLinks[index];

  if(!item || !item.url || item.url.startsWith("LINK_")) return;

  window.location.href = withRefreshParam(item.url);
}

renderTaiLieu();
</script>
