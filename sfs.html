<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SFS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #eef3fb;
      --green-dark: #005f37;
      --text-main: #294b96;
      --text-soft: #6f7d95;
      --card: #ffffff;
      --line: #dbe3ee;
      --font-main: "Roboto Condensed", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      font-family: var(--font-main);
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text-main);
    }

    body {
      min-height: 100vh;
    }

    .app-shell {
      min-height: 100vh;
      background: var(--bg);
    }

    .app-header {
      background: var(--green-dark);
      color: #fff;
      padding: max(10px, env(safe-area-inset-top)) 14px 12px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 56px;
    }

    .back-btn {
      border: none;
      background: rgba(255,255,255,0.16);
      color: #fff;
      border-radius: 14px;
      width: 52px;
      height: 52px;
      font-size: 28px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 52px;
    }

    .header-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.2px;
      line-height: 1.15;
    }

    .main-content {
      padding: 18px 16px 28px;
      max-width: 900px;
      margin: 0 auto;
    }

    .button-list,
    .event-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .menu-btn {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text-main);
      border-radius: 18px;
      padding: 22px 24px;
      text-align: left;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.3;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .menu-btn:hover {
      background: #f8fbff;
    }

    .event-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px 22px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .event-year {
      font-size: 14px;
      color: #7d8797;
      margin: 0 0 10px 0;
      font-weight: 600;
      line-height: 1.3;
    }

    .event-name {
      margin: 0;
      font-size: 18px;
      color: #111;
      font-weight: 400;
      line-height: 1.7;
      text-align: justify;
      text-indent: 1.6em;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .hidden {
      display: none !important;
    }

    .loading,
    .empty {
      color: var(--text-soft);
      font-size: 18px;
      padding: 10px 6px;
      line-height: 1.5;
    }

    @media (max-width: 700px) {
      .header-title {
        font-size: 24px;
      }

      .menu-btn {
        font-size: 18px;
        padding: 20px 22px;
      }

      .event-card {
        padding: 20px 18px;
      }

      .event-name {
        font-size: 17px;
        line-height: 1.68;
        text-indent: 1.45em;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-row">
        <button class="back-btn" onclick="goBack()">←</button>
        <div class="header-title" id="headerTitle">SFS</div>
      </div>
    </header>

    <main class="main-content">
      <div id="loadingText" class="loading">Đang tải dữ liệu...</div>

      <div id="categoryScreen" class="button-list hidden"></div>

      <div id="detailScreen" class="hidden">
        <div id="eventList" class="event-list"></div>
      </div>
    </main>
  </div>

  <script>
    const SHEET_ID = "1oLxufg1IYuHXF4LtSsmme2nYvtMTNSAav8LgJzOGfWw";
    const GID = "1544561860";
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

    const CATEGORY_BUTTONS = [
      { label: "Giới thiệu", match: "Giới thiệu về sfs" },
      { label: "Lịch sử Bắn súng thế giới", match: "Lịch sử Bắn súng Thế giới" },
      { label: "Lịch sử Bắn súng Việt nam", match: "Lịch sử Bắn súng Việt nam" }
    ];

    let allRows = [];
    let currentCategory = null;

    function normalizeText(str) {
      return (str || "")
        .toString()
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ")
        .replace(/đ/g, "d")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function escapeHTML(str) {
      return (str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function splitCSVRow(row) {
      const result = [];
      let current = "";
      let inQuotes = false;

      for (let i = 0; i < row.length; i++) {
        const ch = row[i];
        const next = row[i + 1];

        if (ch === '"') {
          if (inQuotes && next === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === "," && !inQuotes) {
          result.push(current);
          current = "";
        } else {
          current += ch;
        }
      }

      result.push(current);
      return result.map(v => v.trim());
    }

    function parseCSV(text) {
      return text
        .replace(/\r/g, "")
        .split("\n")
        .filter(line => line.trim() !== "")
        .map(splitCSVRow);
    }

    async function fetchData() {
      const res = await fetch(CSV_URL, { cache: "no-store" });
      if (!res.ok) {
        throw new Error("Không tải được CSV");
      }

      const text = await res.text();
      const rows = parseCSV(text);

      allRows = rows
        .map(cols => ({
          category: (cols[0] || "").trim(),
          year: (cols[1] || "").trim(),
          event: (cols[2] || "").trim()
        }))
        .filter(item => item.category || item.year || item.event);
    }

    function renderCategories() {
      currentCategory = null;

      document.getElementById("headerTitle").textContent = "SFS";

      const loadingText = document.getElementById("loadingText");
      const categoryScreen = document.getElementById("categoryScreen");
      const detailScreen = document.getElementById("detailScreen");

      loadingText.classList.add("hidden");
      detailScreen.classList.add("hidden");
      categoryScreen.classList.remove("hidden");
      categoryScreen.innerHTML = "";

      CATEGORY_BUTTONS.forEach(item => {
        const btn = document.createElement("button");
        btn.className = "menu-btn";
        btn.textContent = item.label;
        btn.onclick = () => openCategory(item);
        categoryScreen.appendChild(btn);
      });
    }

    function openCategory(item) {
      currentCategory = item;

      document.getElementById("headerTitle").textContent = item.label;

      const categoryScreen = document.getElementById("categoryScreen");
      const detailScreen = document.getElementById("detailScreen");
      const eventList = document.getElementById("eventList");

      categoryScreen.classList.add("hidden");
      detailScreen.classList.remove("hidden");
      eventList.innerHTML = "";

      const matched = allRows.filter(
        row => normalizeText(row.category) === normalizeText(item.match)
      );

      if (!matched.length) {
        eventList.innerHTML = `<div class="empty">Không có dữ liệu.</div>`;
        return;
      }

      matched.forEach(row => {
        const card = document.createElement("div");
        card.className = "event-card";

        const yearHTML = row.year
          ? `<div class="event-year">${escapeHTML(row.year)}</div>`
          : "";

        card.innerHTML = `
          ${yearHTML}
          <div class="event-name">${escapeHTML(row.event || "")}</div>
        `;

        eventList.appendChild(card);
      });
    }

    function goBack() {
      if (currentCategory) {
        renderCategories();
      } else {
        history.back();
      }
    }

    async function init() {
      try {
        await fetchData();
        renderCategories();
      } catch (err) {
        document.getElementById("loadingText").textContent = "Không tải được dữ liệu.";
      }
    }

    init();
  </script>
</body>
</html>
