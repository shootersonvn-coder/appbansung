<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">
<title>All Event</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css?v=2">

<style>
:root{
  --bg:#e8f0ea;
  --tab-bg:#dfe9e2;
  --tab-text:#155530;
  --date-red:#e53935;
  --card-bg:#fff;
  --time-gray:#9a9aa0;
  --text-main:#155530;
  --pdf-on:rgba(80,80,85,.85);
  --pdf-off:rgba(80,80,85,.28);
  --line-green:#017201;

  --header-h:75px;
  --tabs-h:56px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  font-family:"Roboto Condensed",-apple-system,BlinkMacSystemFont,sans-serif;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:#111;
  font-size:14px;
}

body{
  padding-top:75px;
}



#summary{
  display:none !important;
}

/* CHỈ STYLE RIÊNG PHẦN TAB */
.tabs{
  position:fixed;
  top:75px;
  left:0;
  right:0;
  z-index:900;

  width:100%;
  padding:8px 14px 10px;

  display:flex;
  gap:4px;
  padding-right:6px;
  overflow-x:auto;

  background:#e8f0ea;
  scrollbar-width:none;
  box-shadow:0 12px 0 #e8f0ea;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  flex:1;
  min-width:72px;
  height:34px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:17px;
  background:var(--tab-bg);
  color:var(--tab-text);

  font-size:14px;
  font-weight:800;
  white-space:nowrap;
}

.tabs::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-14px;
  height:14px;
  background:#e8f0ea;
  pointer-events:none;
}

/* CHỈ STYLE RIÊNG PHẦN NỘI DUNG */
.content{
  width:100%;
  padding-top:72px;
  padding-bottom:40px;
}


.date{
  width:calc(100% - 40px);
  margin:-5px auto 6px;/*Chỉnh lề*/
  color:var(--date-red);
  font-size:16px;
  font-weight:700;
}

.schedule-card{
  width:calc(100% - 40px);
  margin:0 auto 12px;
  padding:14px 18px 15px;
  border-radius:18px;
  background:var(--card-bg);
  border:1px solid rgba(0,0,0,.04);
  box-shadow:0 3px 10px rgba(0,0,0,.05);
}

.card-main-time{
  color:var(--time-gray);
  font-size:16px;
  line-height:1;
  margin-bottom:8px;
  font-variant-numeric:tabular-nums;
}

.card-main-title{
  color:var(--text-main);
  font-size:14px;
  font-weight:800;
  line-height:1.15;
}



.schedule-card.is-green .card-main-title,
.schedule-card.is-green .sub-label{
  color:var(--line-green);
}

.schedule-card.is-red .card-main-title,
.schedule-card.is-red .card-main-time,
.schedule-card.is-red .sub-label,
.schedule-card.is-red .sub-time{
  color:var(--date-red);
}

.sub-list{
  margin-top:10px;
  padding-top:8px;
  border-top:1px solid #d8dde5;
}

.sub-row{
  display:grid;
  grid-template-columns:64px 1fr 30px;
  gap:10px;
  align-items:center;
  min-height:34px;
  padding:2px 0;
}

.sub-time{
  color:var(--time-gray);
  font-size:15px;
  font-variant-numeric:tabular-nums;
}

.sub-label{
  color:#111;
  font-size:16px;
  line-height:1.15;
}

.sub-pdf-wrap{
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:flex-end;
}

.sub-pdf{
  width:28px;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.sub-pdf svg{
  width:22px;
  height:22px;
}

.sub-pdf.on{
  color:var(--pdf-on);
}

.sub-pdf.off{
  color:var(--pdf-off);
}

.loading{
  width:100%;
  min-height:calc(100vh - 260px);

  display:flex;
  align-items:center;
  justify-content:center;

  color:#2f6c48;
  font-size:16px;
  font-weight:700;
  text-align:center;
}

.page-back-button{
  border:none;
  background:transparent;
  padding:0;
  font-family:inherit;
}

.page-header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:1000;
}






@media (min-width:768px){
  .tabs{
    padding:75px 32px 12px;
    gap:12px;
  }

  .tab{
    height:54px;
    font-size:18px;
  }

  .date{
    width:calc(100% - 64px);
    font-size:22px;
  }

  .schedule-card{
    width:calc(100% - 64px);
    padding:22px;
    border-radius:20px;
  }

  .card-main-time,
  .card-main-title,
  .sub-time,
  .sub-label{
    font-size:22px;
  }

  .sub-row{
    grid-template-columns:92px 1fr 34px;
    min-height:42px;
  }
}
</style>
</head>

<body>

<header class="page-header">
  <div class="page-header-inner">

    <button class="page-back page-back-button" onclick="history.back()">
      ← Quay lại
    </button>

    <div class="page-title-wrap">
      <div class="page-title" id="name"></div>
      <div class="page-subtitle">Lịch đấu</div>
    </div>

  </div>
</header>

<div class="tabs">
  <div class="tab" onclick="window.location.href='../tailieumenu.html'">
  Tài liệu
</div>
  <div class="tab">Đăng ký</div>
  <div class="tab">Danh sách</div>
  <div class="tab">Đẳng cấp</div>
  <div class="tab">Kỷ lục</div>
</div>

<div class="content">
  <div id="schedule">
    <div class="loading">Đang tải...</div>
  </div>
</div>

<script>
const scheduleUrl =
"https://docs.google.com/spreadsheets/d/1MATLspvOeL4MFObWUIiYqjKkw-PkEEQ7IqXCw-kRheQ/export?format=csv&gid=1558133737";

const params = new URLSearchParams(window.location.search);
const yearParam = (params.get("year") || "").trim();
const competitionParam = (params.get("competition") || "").trim();

let expandedCardId = null;

function trim(s){
  return (s || "").toString().trim();
}

function norm(s){
  return trim(s)
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/đ/g,"d")
    .replace(/Đ/g,"D")
    .toLowerCase()
    .replace(/\s+/g," ");
}

function splitCSVRow(row){
  const result = [];
  let current = "";
  let insideQuotes = false;

  for(let i=0;i<row.length;i++){
    const char = row[i];
    const next = row[i+1];

    if(char === '"'){
      if(insideQuotes && next === '"'){
        current += '"';
        i++;
      }else{
        insideQuotes = !insideQuotes;
      }
    }else if(char === "," && !insideQuotes){
      result.push(current);
      current = "";
    }else{
      current += char;
    }
  }

  result.push(current);
  return result.map(v => v.trim());
}

function normalizeText(s){
  return trim(s).replace(/\s+/g," ");
}

function extractTimeAndDate(raw){
  const text = trim(raw);
  const dateMatch = text.match(/(\d{1,2}\.\d{1,2}\.\d{4})/);
  const timeMatch = text.match(/(\d{1,2}[:h]\d{2})/);

  const date = dateMatch ? dateMatch[1] : "";
  let time = timeMatch ? timeMatch[1] : "";

  if(time.includes("h")){
    time = time.replace("h",":");
  }

  return {time,date};
}

function toSort(date,time){
  const [dd,mm,yyyy] = trim(date).split(".");
  const [hh,mi] = trim(time).split(":");

  if(!dd || !mm || !yyyy) return Number.MAX_SAFE_INTEGER;

  return Number(
    `${yyyy}${mm.padStart(2,"0")}${dd.padStart(2,"0")}${(hh || "00").padStart(2,"0")}${(mi || "00").padStart(2,"0")}`
  );
}

function baseTitle(title){
  const s = trim(title);
  const t = norm(s);

  const keys = [" - c.ket","- c.ket"," - chung ket","- chung ket"];

  for(const k of keys){
    const idx = t.indexOf(k);
    if(idx >= 0) return trim(s.slice(0,idx));
  }

  return s;
}

function isFinalTitle(title){
  const t = norm(title);
  return t.includes("c.ket") || t.includes("chung ket");
}

function isGreenLine(s){
  const t = norm(s);
  return t.includes("kiem tra")
    || t.includes("don tiep")
    || t.includes("trong tai")
    || t.includes("btc")
    || t.includes("to chuc")
    || t.includes("chuan bi")
    || t.includes("ky thuat")
    || t.includes("tap luyen")
    || t.includes("ve")
    || t.includes("doan");
}

function isRedLine(s){
  const t = norm(s);
  return t.includes("mac") || t.includes("thuong") || t.includes("tham");
}

function hasIndividualCode(p){
  const up = trim(p).toUpperCase();
  return up.includes("C") || up.includes("K") || /\d/.test(up);
}

function hasTeamCode(p){
  return /\d/.test(trim(p).toUpperCase());
}

function teamLabel(title){
  const t = norm(title);
  if(t.includes("hon hop") && t.includes("dong doi")) return "Hỗn hợp";
  return "Đồng đội";
}

function pdfIcon(state){
  return `
    <span class="sub-pdf ${state}">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M14 2v5h5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M9 12h6M9 16h6M9 8h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </span>
  `;
}

function buildGroupedItems(rows){
  const map = new Map();

  const yearNorm = norm(yearParam);
  const competitionNorm = norm(competitionParam);

  for(let i=1;i<rows.length;i++){
    const r = rows[i] || [];

    const year = trim(r[0]);
    const competition = trim(r[3]);
    const rawTime = normalizeText(r[4]);
    const content = normalizeText(r[5]);

    if(!year || !competition || !rawTime || !content) continue;

    if(yearNorm && norm(year) !== yearNorm) continue;
    if(competitionNorm && norm(competition) !== competitionNorm) continue;

    const base = baseTitle(content);
    const p = extractTimeAndDate(rawTime);
    const key = `${norm(year)}|${norm(competition)}|${p.date}|${norm(base)}`;

    if(!map.has(key)){
      map.set(key,{
        id:key,
        year,
        competition,
        title:base,
        date:p.date,
        time:p.time,
        sort:toSort(p.date,p.time),
        rows:[],
        hasFinal:false,
        finalTime:"",
        pdfList:"",
        pdfIndividual:"",
        pdfTeam:"",
        pdfFinal:""
      });
    }

    const item = map.get(key);

    item.rows.push({
      pCode:trim(r[15]),
      k:trim(r[25]),
      isFinal:isFinalTitle(content),
      pdfList:trim(r[34]),
      pdfIndividual:trim(r[35]),
      pdfTeam:trim(r[36]),
      pdfFinal:trim(r[37]),
      time:p.time
    });

    if(!item.pdfList) item.pdfList = trim(r[34]);
    if(!item.pdfIndividual) item.pdfIndividual = trim(r[35]);
    if(!item.pdfTeam) item.pdfTeam = trim(r[36]);

    if(
  isFinalTitle(content)
  || trim(r[25])
  || trim(r[37])
){
  item.hasFinal = true;

  item.finalTime =
    p.time || item.finalTime;

  item.pdfFinal =
    trim(r[37]) || item.pdfFinal;
}
  }

  const items = Array.from(map.values()).map(item => {
    const pJoined = item.rows.map(x => x.pCode).filter(Boolean).join(" ");
const allowIndividual = hasIndividualCode(pJoined);
const allowTeam = allowIndividual && hasTeamCode(pJoined);

const isVietnamTeam =
  norm(item.title) === "doi tuyen viet nam tham du";






  const subLines = [];

if(isVietnamTeam){

  subLines.push({
    label:"Danh sách",
    time:"",
    link:item.pdfList
  });

}else{

  if(allowIndividual){

    subLines.push({
      label:"Danh sách",
      time:"",
      link:item.pdfList
    });

    subLines.push({
      label:"Cá nhân",
      time:item.time || " ",
      link:item.pdfIndividual
    });

    if(allowTeam){
      subLines.push({
        label:teamLabel(item.title),
        time:item.time || " ",
        link:item.pdfTeam
      });
    }

    if(item.hasFinal){
      subLines.push({
        label:"Chung kết",
        time:item.finalTime || " ",
        link:item.pdfFinal
      });
    }

  }



}
    







    return {
      ...item,
      subLines,
      isGreen:isGreenLine(item.title),
      isRed:isRedLine(item.title)
    };
  });

  items.sort((a,b)=>a.sort-b.sort);

  return {
    items,
    yearText:yearParam,
    nameText:competitionParam
  };
}

function render(){
  const data = window.__SCHEDULE_DATA__;
  const container = document.getElementById("schedule");

  container.innerHTML = "";

  if(!data || !data.items.length){
    container.innerHTML = `<div class="loading">Không có dữ liệu</div>`;
    return;
  }

  let currentDate = "";

  data.items.forEach(item => {
    if(item.date && item.date !== currentDate){
      currentDate = item.date;

      const d = document.createElement("div");
      d.className = "date";
      d.textContent = item.date;
      container.appendChild(d);
    }

    const card = document.createElement("div");
    const expanded = expandedCardId === item.id;

    card.className =
      "schedule-card"
      + (item.isGreen ? " is-green" : "")
      + (item.isRed ? " is-red" : "");

    const subHtml = expanded
      ? `
        <div class="sub-list">
          ${item.subLines.map(line => `
            <div class="sub-row" data-sub-label="${encodeURIComponent(line.label)}">
              <div class="sub-time">${line.time || " "}</div>
              <div class="sub-label">${line.label}</div>
              <div class="sub-pdf-wrap" ${line.link ? `data-pdf-link="${encodeURIComponent(line.link)}"` : ""}>
                ${pdfIcon(line.link ? "on" : "off")}
              </div>
            </div>
          `).join("")}
        </div>
      `
      : "";

    card.innerHTML = `
  



    ${!expanded &&
  norm(item.title) !== "doi tuyen viet nam tham du"
  ? `<div class="card-main-time">${item.time || " "}</div>`
  : ``}

  <div class="card-main-title">${item.title}</div>
  ${subHtml}
`;

    card.addEventListener("click", function(e){
      const pdfWrap = e.target.closest("[data-pdf-link]");

      if(pdfWrap){
        e.preventDefault();
        e.stopPropagation();

        const link = decodeURIComponent(
          pdfWrap.getAttribute("data-pdf-link") || ""
        );

        const subLabel = decodeURIComponent(
          pdfWrap.closest(".sub-row")
            ?.getAttribute("data-sub-label") || ""
        );

        if(!link) return;

        window.location.href =
          "../pdfviewer.html"
          + "?title=" + encodeURIComponent(item.title + " - " + subLabel)
          + "&url=" + encodeURIComponent(link);

        return;
      }

      const subRow = e.target.closest(".sub-row");

      if(subRow){
        e.preventDefault();
        e.stopPropagation();

        const subLabel = decodeURIComponent(
          subRow.getAttribute("data-sub-label") || ""
        );

        window.location.href =
          "./event-all.html"
          + "?name=" + encodeURIComponent(item.title)
          + "&date=" + encodeURIComponent(item.date)
          + "&time=" + encodeURIComponent(item.time)
          + "&year=" + encodeURIComponent(data.yearText)
          + "&competition=" + encodeURIComponent(data.nameText)
          + "&hasFinal=" + encodeURIComponent(item.hasFinal ? "1" : "0")
          + "&pdfFinal=" + encodeURIComponent(item.pdfFinal || "")
          + "&openTab=" + encodeURIComponent(subLabel);

        return;
      }

      if(item.isGreen){
        return;
      }

      if(expandedCardId !== item.id){
        expandedCardId = item.id;
        render();
      }else{
        expandedCardId = null;
        render();
      }
    });

    container.appendChild(card);
  });
}

async function load(){
  try{
    const res = await fetch(scheduleUrl + "&t=" + Date.now(), {cache:"no-store"});
    const text = await res.text();

    const rows = text
      .split(/\r?\n/)
      .filter(r => r.trim())
      .map(r => splitCSVRow(r));

    const grouped = buildGroupedItems(rows);

    document.getElementById("name").innerText =
      [grouped.nameText, grouped.yearText].filter(Boolean).join(" ");

    window.__SCHEDULE_DATA__ = grouped;
    render();
  }catch(e){
    document.getElementById("schedule").innerHTML =
      `<div class="loading">Không tải được dữ liệu</div>`;
  }
}

load();


</script>

<script>
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());
</script>

</body>
</html>
