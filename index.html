<script>
const latestBannerCSV =
  "https://docs.google.com/spreadsheets/d/1MATLspvOeL4MFObWUIiYqjKkw-PkEEQ7IqXCw-kRheQ/export?format=csv&gid=311114195";

const MEDAL_SOURCE_URL =
  "https://docs.google.com/spreadsheets/d/1MATLspvOeL4MFObWUIiYqjKkw-PkEEQ7IqXCw-kRheQ/export?format=csv&gid=1558133737";

const UNIT_SOURCE_URL =
  "https://docs.google.com/spreadsheets/d/1MATLspvOeL4MFObWUIiYqjKkw-PkEEQ7IqXCw-kRheQ/export?format=csv&gid=1062776861";

const AUTO_REFRESH_MS = 15000;
const MEDAL_MIN_ROWS = 11;

let sideBannerItems = [];
let sideBannerIndex = 0;
let sideBannerTimer = null;
let autoRefreshTimer = null;
let lastMainBannerURL = localStorage.getItem("lastMainBannerURL") || "";
let lastMedalSnapshot = "";

let latestCompetitionYear = "";
let latestCompetitionName = "";
let latestCompetitionTime = "";

function splitCSVRow(row) {
  const result = [];
  let current = "";
  let insideQuotes = false;

  for (let i = 0; i < row.length; i++) {
    const char = row[i];
    const next = row[i + 1];

    if (char === '"') {
      if (insideQuotes && next === '"') {
        current += '"';
        i++;
      } else {
        insideQuotes = !insideQuotes;
      }
    } else if (char === "," && !insideQuotes) {
      result.push(current.trim());
      current = "";
    } else {
      current += char;
    }
  }

  result.push(current.trim());
  return result;
}

function parseCSV(text) {
  return text
    .trim()
    .split(/\r?\n/)
    .map(splitCSVRow);
}

function buildDangKyPdfUrl(gid, orientation, top, bottom, left, right) {
  const portrait =
    String(orientation || "portrait").trim().toLowerCase() !== "landscape";

  return `https://docs.google.com/spreadsheets/d/${dangKySheetId}/export?format=pdf&gid=${gid}&size=A4&portrait=${portrait}&fitw=true&scale=2&top_margin=${top || 0.25}&bottom_margin=${bottom || 0.25}&left_margin=${left || 0.50}&right_margin=${right || 0.25}&gridlines=false&sheetnames=false&printtitle=false&fzr=false`;
}

async function refreshDangKyLinks() {
  const res = await fetch(withRefreshParam(dangKyCsvUrl), { cache: "no-store" });
  if (!res.ok) throw new Error("Không tải được danh sách đăng ký");

  const text = await res.text();
  const rows = parseCSV(text);

  dangKyLinks = rows
    .slice(1)
    .map((row) => {
      const title = (row[0] || "").trim();
      const gidCell = (row[1] || "").trim();
      const orientation = (row[2] || "portrait").trim();
      const top = (row[3] || "0.25").trim();
      const bottom = (row[4] || "0.25").trim();
      const left = (row[5] || "0.50").trim();
      const right = (row[6] || "0.25").trim();

      if (!title || !gidCell) return null;

      const gids = gidCell
        .split(",")
        .map(s => s.trim())
        .filter(Boolean);

      if (!gids.length) return null;

      return {
        title,
        gids,
        orientation,
        top,
        bottom,
        left,
        right
      };
    })
    .filter(Boolean);
}

function normalizeDriveImage(url) {
  if (!url) return "";

  const s = url.trim();

  const fileMatch = s.match(/\/file\/d\/([^/]+)/);
  if (fileMatch && fileMatch[1]) {
    return "https://drive.google.com/thumbnail?id=" + fileMatch[1] + "&sz=w1600";
  }

  if (s.includes("open?id=")) {
    const id = new URL(s).searchParams.get("id");
    if (id) {
      return "https://drive.google.com/thumbnail?id=" + id + "&sz=w1600";
    }
  }

  if (s.includes("uc?")) {
    const id = new URL(s).searchParams.get("id");
    if (id) {
      return "https://drive.google.com/thumbnail?id=" + id + "&sz=w1600";
    }
  }

  if (s.includes("thumbnail?id=")) {
    return s;
  }

  return s;
}

function withRefreshParam(url) {
  if (!url) return url;
  const joiner = url.includes("?") ? "&" : "?";
  return `${url}${joiner}app_refresh=${Date.now()}`;
}

function buildLatestEventUrl(){
  if(!latestCompetitionYear || !latestCompetitionName) {
    return withRefreshParam("competition.html");
  }

  return "Cac-giai-dau/all-event.html"
    + "?year=" + encodeURIComponent(latestCompetitionYear)
    + "&competition=" + encodeURIComponent(latestCompetitionName)
    + "&time=" + encodeURIComponent(latestCompetitionTime)
    + "&app_refresh=" + Date.now();
}

function openLatestEventFromBanner(e){
  if(e) e.preventDefault();
  window.location.href = buildLatestEventUrl();
}

 function refreshAppLinks() {
  const heroMainLink = document.getElementById("hero-main-link");
  if (heroMainLink) {
    heroMainLink.href = buildLatestEventUrl();
  }

  const sideBannerLink = document.getElementById("side-banner-link");
  if (sideBannerLink && !sideBannerLink.href.includes("competitionKey=")) {
    sideBannerLink.href = withRefreshParam("imagegallery.html?mode=grid");
  }
}


async function loadMainBanner() {
  const img = document.getElementById("main-banner-image");

  if (img && lastMainBannerURL) {
    img.src = lastMainBannerURL;
  }

  try {
    const res = await fetch(latestBannerCSV + "&cb=" + Date.now(), { cache: "no-store" });
    const text = await res.text();

    const firstLine = text.split(/\r?\n/).find(line => line.trim() !== "") || "";
    const cols = splitCSVRow(firstLine);

    const latestYear = (cols[0] || "").trim();
const latestTime = (cols[1] || "").trim();
const latestCompetitionKey = (cols[3] || "").trim();
const latestCompetitionTitle = latestCompetitionKey;

latestCompetitionYear = latestYear;
latestCompetitionTime = latestTime;
latestCompetitionName = latestCompetitionKey;

    const heroMainLink = document.getElementById("hero-main-link");
if (heroMainLink) {
  heroMainLink.href = buildLatestEventUrl();
}

    const sideBannerLink = document.getElementById("side-banner-link");
    if (sideBannerLink) {
      sideBannerLink.href =
        "imagegallery.html?year=" + encodeURIComponent(latestYear) +
        "&competitionKey=" + encodeURIComponent(latestCompetitionKey) +
        "&competitionTitle=" + encodeURIComponent(latestCompetitionTitle) +
        "&mode=grid" +
        "&app_refresh=" + Date.now();
    }

    const rawURL = cols[27] || "";
    const finalURL = normalizeDriveImage(rawURL);

    if (img && finalURL) {
      const preloader = new Image();

      preloader.onload = function () {
        img.src = finalURL;
        lastMainBannerURL = finalURL;
        localStorage.setItem("lastMainBannerURL", finalURL);
      };

      preloader.onerror = function () {
        if (lastMainBannerURL) {
          img.src = lastMainBannerURL;
        }
      };

      preloader.src = finalURL;
    }

    await loadSideBannerImages();
    await loadMedalBoard(true);
  } catch (e) {
    console.log("Lỗi banner", e);

    if (img && lastMainBannerURL) {
      img.src = lastMainBannerURL;
    }
  }
}

async function loadSideBannerImages() {
  try {
    const url =
      "https://docs.google.com/spreadsheets/d/12ZhbKYiDgXBT5ALCfjJBoVrh3cUS8Wbmy4lVRDRoGg8/gviz/tq?tqx=out:csv&gid=0&cb=" +
      Date.now();

    const res = await fetch(url, { cache: "no-store" });
    const text = await res.text();

    const lines = text.split(/\r?\n/).filter(line => line.trim() !== "");
    if (lines.length < 2) return;

    const matched = [];

    for (const line of lines.slice(1)) {
      const cols = splitCSVRow(line);
      if (cols.length < 6) continue;

      const image = normalizeDriveImage((cols[3] || "").trim());
      const thumb = normalizeDriveImage((cols[4] || "").trim());
      const enabled = (cols[5] || "").trim() === "1";

      if (!enabled || !image) continue;

      matched.push(thumb || image);
    }

    sideBannerItems = matched.slice(0, 10);

    const img = document.getElementById("side-banner-image");
    const link = document.getElementById("side-banner-link");
    if (!img || !link || !sideBannerItems.length) return;

    sideBannerIndex = 0;
    img.src = sideBannerItems[0];

    if (!link.href.includes("app_refresh=")) {
      link.href = withRefreshParam("imagegallery.html?mode=grid");
    }

    if (sideBannerTimer) {
      clearInterval(sideBannerTimer);
    }

    sideBannerTimer = setInterval(() => {
      if (!sideBannerItems.length) return;
      sideBannerIndex = (sideBannerIndex + 1) % sideBannerItems.length;
      img.src = sideBannerItems[sideBannerIndex];
    }, 5000);
  } catch (e) {
    console.log("Lỗi side banner", e);
  }
}

function toInt(value) {
  const n = parseInt(String(value || "").trim(), 10);
  return Number.isFinite(n) ? n : 0;
}

function buildEmptyMedalRow() {
  return `
    <div class="medal-row medal-grid five-cols empty-row">
      <div class="unit">&nbsp;</div>
      <div class="medal">&nbsp;</div>
      <div class="medal">&nbsp;</div>
      <div class="medal">&nbsp;</div>
      <div class="medal">&nbsp;</div>
    </div>
  `;
}

function renderMedalRows(data) {
  const filledRows = data.map((d) => `
    <div class="medal-row medal-grid five-cols">
      <div class="unit linkish">${d.unit}</div>
      <div class="medal">${d.gold || ""}</div>
      <div class="medal">${d.silver || ""}</div>
      <div class="medal">${d.bronze || ""}</div>
      <div class="medal">${d.kl || ""}</div>
    </div>
  `);

  const emptyCount = Math.max(0, MEDAL_MIN_ROWS - data.length);
  for (let i = 0; i < emptyCount; i++) {
    filledRows.push(buildEmptyMedalRow());
  }

  return filledRows.join("");
}

function clean(v){
  return String(v || "").trim();
}

function sortTextVN(v){
  return String(v || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/đ/g,"d")
    .trim();
}

function medalType(v){
  const s = clean(v).toLowerCase().replace(/\s+/g,"");

  if(s === "v" || s === "v1") return "gold";
  if(s === "b" || s === "b1") return "silver";
  if(s === "đ" || s === "d" || s === "đ1" || s === "d1" || s === "đ4" || s === "d4") return "bronze";

  return "";
}

function hasRecord(v){
  const s = clean(v).toLowerCase();
  return s && s !== "0" && s !== "-" && s !== "không";
}

function recordGroupFromCode(code){
  const c = clean(code).toUpperCase().replace("Đ","D");

  if(["PKLD1","PKLD2","PKLD3"].includes(c)) return "PKLD1";
  if(["PKLD4","PKLD5","PKLD6"].includes(c)) return "PKLD4";
  if(["PKLD7","PKLD8","PKLD9"].includes(c)) return "PKLD7";

  if(["LKLD1","LKLD2","LKLD3"].includes(c)) return "LKLD1";
  if(["LKLD4","LKLD5","LKLD6"].includes(c)) return "LKLD4";
  if(["LKLD7","LKLD8","LKLD9"].includes(c)) return "LKLD7";

  if(["DKLD1","DKLD2","DKLD3"].includes(c)) return "DKLD1";
  if(["DKLD4","DKLD5","DKLD6"].includes(c)) return "DKLD4";
  if(["DKLD7","DKLD8","DKLD9"].includes(c)) return "DKLD7";

  return "";
}

function isInternationalCompetition(){
  return latestCompetitionName.includes("-");
}

function isVietnamDomesticUnit(unit){
  const s = sortTextVN(unit);

  return [
    "ha noi","hai phong","tp hcm","hcm","ha tinh",
    "quan doi","cong an nd","da nang","dak lak",
    "dong nai","quang ninh","thanh hoa","phu tho"
  ].includes(s);
}

function makeMedalItem(unit){
  return {
    unit,
    gold:0,
    silver:0,
    bronze:0,
    kl:0,
    recordKeys:new Set()
  };
}

function addMedal(item, value){
  const t = medalType(value);
  if(t === "gold") item.gold++;
  if(t === "silver") item.silver++;
  if(t === "bronze") item.bronze++;
}

async function loadUnitMap(){
  const map = new Map();

  const res = await fetch(UNIT_SOURCE_URL + "&cb=" + Date.now(), {cache:"no-store"});
  const text = await res.text();
  const rows = parseCSV(text).slice(1);

  rows.forEach(r=>{
    const code = clean(r[0]);
    const name = clean(r[1]);
    if(code && name) map.set(code, name);
  });

  return map;
}

async function loadMedalBoard(force = false){
  const medalTable = document.getElementById("medalTableBody");
  const totalRow = document.getElementById("medalTotalRow");
  if(!medalTable || !totalRow) return;

  if(!latestCompetitionYear || !latestCompetitionName){
    medalTable.innerHTML = renderMedalRows([]);
    return;
  }

  try{
    const [res, unitMap] = await Promise.all([
      fetch(MEDAL_SOURCE_URL + "&cb=" + Date.now(), {cache:"no-store"}),
      loadUnitMap()
    ]);

    const text = await res.text();
    const rows = parseCSV(text).slice(2);

    const map = new Map();

    rows.forEach(r=>{
      const year = clean(r[0]);
      const time = clean(r[1]);
      const competition = clean(r[3]);
      const unit = clean(r[14]);

      if(year !== latestCompetitionYear) return;
      if(competition !== latestCompetitionName) return;
      if(!unit) return;

      const displayUnit = unitMap.get(unit) || unit;

      if(isInternationalCompetition() && isVietnamDomesticUnit(displayUnit)){
        return;
      }

      if(!map.has(unit)){
        map.set(unit, makeMedalItem(unit));
      }

      const item = map.get(unit);

      addMedal(item, r[29]); // AD
      addMedal(item, r[30]); // AE

      if(hasRecord(r[26])) item.kl++; // AA
      if(hasRecord(r[27])) item.kl++; // AB

      const ac = clean(r[28]).toUpperCase();

      const singleRecordCodes = [
        "PKLK1","LKLK1","DKLK1",
        "PKLC1","LKLC1","DKLC1"
      ];

      if(singleRecordCodes.includes(ac)){
        item.kl++;
      }

      const recordGroup = recordGroupFromCode(ac);
      if(recordGroup){
        const key = `${competition}__${unit}__${clean(r[5])}__${recordGroup}`;

        if(!item.recordKeys.has(key)){
          item.recordKeys.add(key);
          item.kl++;
        }
      }
    });

    let data = [...map.values()].map(x=>({
      unit: unitMap.get(x.unit) || x.unit,
      rawUnit: x.unit,
      gold: x.gold,
      silver: x.silver,
      bronze: x.bronze,
      kl: x.kl
    }));

    data.sort((a,b)=>{
      const aTotal = a.gold + a.silver + a.bronze;
      const bTotal = b.gold + b.silver + b.bronze;

      const aHas = aTotal > 0 || a.kl > 0;
      const bHas = bTotal > 0 || b.kl > 0;

      if(aHas && !bHas) return -1;
      if(!aHas && bHas) return 1;

      if(!aHas && !bHas){
        return sortTextVN(a.unit).localeCompare(sortTextVN(b.unit));
      }

      return (
        b.gold - a.gold ||
        b.silver - a.silver ||
        b.bronze - a.bronze ||
        b.kl - a.kl ||
        bTotal - aTotal ||
        sortTextVN(a.unit).localeCompare(sortTextVN(b.unit))
      );
    });

    medalTable.innerHTML = renderMedalRows(data);

    const totalGold = data.reduce((s,x)=>s+x.gold,0);
    const totalSilver = data.reduce((s,x)=>s+x.silver,0);
    const totalBronze = data.reduce((s,x)=>s+x.bronze,0);
    const totalKL = data.reduce((s,x)=>s+x.kl,0);

    totalRow.innerHTML = `
      <div class="unit">${data.length}</div>
      <div class="medal">${totalGold}</div>
      <div class="medal">${totalSilver}</div>
      <div class="medal">${totalBronze}</div>
      <div class="medal">${totalKL}</div>
    `;

  }catch(err){
    console.log("Lỗi bảng HC Home", err);
    medalTable.innerHTML = renderMedalRows([]);
  }
}

<script>
function makeDraggable(selector){
  const el = document.querySelector(selector);
  if (!el) return;

  let dragging = false;
  let offsetX = 0;
  let offsetY = 0;

  el.addEventListener("pointerdown", function(e){
    dragging = true;
    el.setPointerCapture(e.pointerId);

    const rect = el.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;

    el.style.position = "fixed";
    el.style.left = rect.left + "px";
    el.style.top = rect.top + "px";
    el.style.right = "auto";
    el.style.bottom = "auto";
    el.style.cursor = "grabbing";
  });

  el.addEventListener("pointermove", function(e){
    if (!dragging) return;

    el.style.left = (e.clientX - offsetX) + "px";
    el.style.top = (e.clientY - offsetY) + "px";
  });

  el.addEventListener("pointerup", function(e){
  dragging = false;
  el.releasePointerCapture(e.pointerId);
  el.style.cursor = "grab";
});

}
