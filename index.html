<script>
const latestBannerCSV =
  "https://docs.google.com/spreadsheets/d/1MATLspvOeL4MFObWUIiYqjKkw-PkEEQ7IqXCw-kRheQ/export?format=csv&gid=311114195";

const medalSheetUrl =
  "https://docs.google.com/spreadsheets/d/1MATLspvOeL4MFObWUIiYqjKkw-PkEEQ7IqXCw-kRheQ/export?format=csv&gid=1974758112";

const AUTO_REFRESH_MS = 15000;
const MEDAL_MIN_ROWS = 11;

let sideBannerItems = [];
let sideBannerIndex = 0;
let sideBannerTimer = null;
let autoRefreshTimer = null;
let lastMainBannerURL = localStorage.getItem("lastMainBannerURL") || "";
let lastMedalSnapshot = "";





function splitCSVRow(row) {
  const result = [];
  let current = "";
  let insideQuotes = false;

  for (let i = 0; i < row.length; i++) {
    const char = row[i];
    const next = row[i + 1];

    if (char === '"') {
      if (insideQuotes && next === '"') {
        current += '"';
        i++;
      } else {
        insideQuotes = !insideQuotes;
      }
    } else if (char === "," && !insideQuotes) {
      result.push(current.trim());
      current = "";
    } else {
      current += char;
    }
  }

  result.push(current.trim());
  return result;
}

function parseCSV(text) {
  return text
    .trim()
    .split(/\r?\n/)
    .map(splitCSVRow);
}

function buildDangKyPdfUrl(gid, orientation, top, bottom, left, right) {
  const portrait =
    String(orientation || "portrait").trim().toLowerCase() !== "landscape";

  return `https://docs.google.com/spreadsheets/d/${dangKySheetId}/export?format=pdf&gid=${gid}&size=A4&portrait=${portrait}&fitw=true&scale=2&top_margin=${top || 0.25}&bottom_margin=${bottom || 0.25}&left_margin=${left || 0.50}&right_margin=${right || 0.25}&gridlines=false&sheetnames=false&printtitle=false&fzr=false`;
}

async function refreshDangKyLinks() {
  const res = await fetch(withRefreshParam(dangKyCsvUrl), { cache: "no-store" });
  if (!res.ok) throw new Error("Không tải được danh sách đăng ký");

  const text = await res.text();
  const rows = parseCSV(text);

  dangKyLinks = rows
    .slice(1)
    .map((row) => {
      const title = (row[0] || "").trim();
      const gidCell = (row[1] || "").trim();
      const orientation = (row[2] || "portrait").trim();
      const top = (row[3] || "0.25").trim();
      const bottom = (row[4] || "0.25").trim();
      const left = (row[5] || "0.50").trim();
      const right = (row[6] || "0.25").trim();

      if (!title || !gidCell) return null;

      const gids = gidCell
        .split(",")
        .map(s => s.trim())
        .filter(Boolean);

      if (!gids.length) return null;

      return {
        title,
        gids,
        orientation,
        top,
        bottom,
        left,
        right
      };
    })
    .filter(Boolean);
}

function normalizeDriveImage(url) {
  if (!url) return "";

  const s = url.trim();

  const fileMatch = s.match(/\/file\/d\/([^/]+)/);
  if (fileMatch && fileMatch[1]) {
    return "https://drive.google.com/thumbnail?id=" + fileMatch[1] + "&sz=w1600";
  }

  if (s.includes("open?id=")) {
    const id = new URL(s).searchParams.get("id");
    if (id) {
      return "https://drive.google.com/thumbnail?id=" + id + "&sz=w1600";
    }
  }

  if (s.includes("uc?")) {
    const id = new URL(s).searchParams.get("id");
    if (id) {
      return "https://drive.google.com/thumbnail?id=" + id + "&sz=w1600";
    }
  }

  if (s.includes("thumbnail?id=")) {
    return s;
  }

  return s;
}

function withRefreshParam(url) {
  if (!url) return url;
  const joiner = url.includes("?") ? "&" : "?";
  return `${url}${joiner}app_refresh=${Date.now()}`;
}

function refreshAppLinks() {
  const heroMainLink = document.getElementById("hero-main-link");
  if (heroMainLink) {
    heroMainLink.href = withRefreshParam("competition.html");
  }

  const sideBannerLink = document.getElementById("side-banner-link");
  if (sideBannerLink && !sideBannerLink.href.includes("competitionKey=")) {
    sideBannerLink.href = withRefreshParam("imagegallery.html?mode=grid");
  }
}

async function loadMainBanner() {
  const img = document.getElementById("main-banner-image");

  if (img && lastMainBannerURL) {
    img.src = lastMainBannerURL;
  }

  try {
    const res = await fetch(latestBannerCSV + "&cb=" + Date.now(), { cache: "no-store" });
    const text = await res.text();

    const firstLine = text.split(/\r?\n/).find(line => line.trim() !== "") || "";
    const cols = splitCSVRow(firstLine);

    const latestYear = (cols[0] || "").trim();
    const latestCompetitionKey = (cols[3] || "").trim();
    const latestCompetitionTitle = latestCompetitionKey;

    const heroMainLink = document.getElementById("hero-main-link");
    if (heroMainLink) {
      heroMainLink.href = withRefreshParam("competition.html");
    }

    const sideBannerLink = document.getElementById("side-banner-link");
    if (sideBannerLink) {
      sideBannerLink.href =
        "imagegallery.html?year=" + encodeURIComponent(latestYear) +
        "&competitionKey=" + encodeURIComponent(latestCompetitionKey) +
        "&competitionTitle=" + encodeURIComponent(latestCompetitionTitle) +
        "&mode=grid" +
        "&app_refresh=" + Date.now();
    }

    const rawURL = cols[27] || "";
    const finalURL = normalizeDriveImage(rawURL);

    if (img && finalURL) {
      const preloader = new Image();

      preloader.onload = function () {
        img.src = finalURL;
        lastMainBannerURL = finalURL;
        localStorage.setItem("lastMainBannerURL", finalURL);
      };

      preloader.onerror = function () {
        if (lastMainBannerURL) {
          img.src = lastMainBannerURL;
        }
      };

      preloader.src = finalURL;
    }

    await loadSideBannerImages();
  } catch (e) {
    console.log("Lỗi banner", e);

    if (img && lastMainBannerURL) {
      img.src = lastMainBannerURL;
    }
  }
}

async function loadSideBannerImages() {
  try {
    const url =
      "https://docs.google.com/spreadsheets/d/12ZhbKYiDgXBT5ALCfjJBoVrh3cUS8Wbmy4lVRDRoGg8/gviz/tq?tqx=out:csv&gid=0&cb=" +
      Date.now();

    const res = await fetch(url, { cache: "no-store" });
    const text = await res.text();

    const lines = text.split(/\r?\n/).filter(line => line.trim() !== "");
    if (lines.length < 2) return;

    const matched = [];

    for (const line of lines.slice(1)) {
      const cols = splitCSVRow(line);
      if (cols.length < 6) continue;

      const image = normalizeDriveImage((cols[3] || "").trim());
      const thumb = normalizeDriveImage((cols[4] || "").trim());
      const enabled = (cols[5] || "").trim() === "1";

      if (!enabled || !image) continue;

      matched.push(thumb || image);
    }

    sideBannerItems = matched.slice(0, 10);

    const img = document.getElementById("side-banner-image");
    const link = document.getElementById("side-banner-link");
    if (!img || !link || !sideBannerItems.length) return;

    sideBannerIndex = 0;
    img.src = sideBannerItems[0];

    if (!link.href.includes("app_refresh=")) {
      link.href = withRefreshParam("imagegallery.html?mode=grid");
    }

    if (sideBannerTimer) {
      clearInterval(sideBannerTimer);
    }

    sideBannerTimer = setInterval(() => {
      if (!sideBannerItems.length) return;
      sideBannerIndex = (sideBannerIndex + 1) % sideBannerItems.length;
      img.src = sideBannerItems[sideBannerIndex];
    }, 5000);
  } catch (e) {
    console.log("Lỗi side banner", e);
  }
}

function toInt(value) {
  const n = parseInt(String(value || "").trim(), 10);
  return Number.isFinite(n) ? n : 0;
}

function buildEmptyMedalRow() {
  return `
    <div class="medal-row medal-grid five-cols empty-row">
      <div class="unit">&nbsp;</div>
      <div class="medal">&nbsp;</div>
      <div class="medal">&nbsp;</div>
      <div class="medal">&nbsp;</div>
      <div class="medal">&nbsp;</div>
    </div>
  `;
}

function renderMedalRows(data) {
  const filledRows = data.map((d) => `
    <div class="medal-row medal-grid five-cols">
      <div class="unit linkish">${d.unit}</div>
      <div class="medal">${d.gold || ""}</div>
      <div class="medal">${d.silver || ""}</div>
      <div class="medal">${d.bronze || ""}</div>
      <div class="medal">${d.kl || ""}</div>
    </div>
  `);

  const emptyCount = Math.max(0, MEDAL_MIN_ROWS - data.length);
  for (let i = 0; i < emptyCount; i++) {
    filledRows.push(buildEmptyMedalRow());
  }

  return filledRows.join("");
}

async function loadMedalBoard(force = false) {
  try {
    const res = await fetch(medalSheetUrl + "&cb=" + Date.now(), { cache: "no-store" });
    const text = await res.text();

    const normalized = text.replace(/^\uFEFF/, "").trim();
    if (!force && normalized === lastMedalSnapshot) {
      return;
    }
    lastMedalSnapshot = normalized;

    const lines = normalized.split(/\r?\n/).filter(line => line.trim() !== "");
    const medalTable = document.getElementById("medalTableBody");
    const totalRow = document.getElementById("medalTotalRow");
    if (!medalTable || !totalRow) return;

    if (lines.length < 2) {
      medalTable.innerHTML = renderMedalRows([]);
      totalRow.innerHTML = `
        <div class="unit">0</div>
        <div class="medal">0</div>
        <div class="medal">0</div>
        <div class="medal">0</div>
        <div class="medal">0</div>
      `;
      return;
    }

    const data = lines.slice(1).map(line => {
      const c = splitCSVRow(line);
      return {
        unit: (c[0] || "").trim(),
        gold: toInt(c[1]),
        silver: toInt(c[2]),
        bronze: toInt(c[3]),
        kl: toInt(c[4])
      };
    }).filter(x => x.unit);

    data.sort((a, b) =>
      b.gold - a.gold ||
      b.silver - a.silver ||
      b.bronze - a.bronze ||
      b.kl - a.kl ||
      a.unit.localeCompare(b.unit, "vi")
    );

    medalTable.innerHTML = renderMedalRows(data);

    const totalGold = data.reduce((s, x) => s + x.gold, 0);
    const totalSilver = data.reduce((s, x) => s + x.silver, 0);
    const totalBronze = data.reduce((s, x) => s + x.bronze, 0);
    const totalKL = data.reduce((s, x) => s + x.kl, 0);

    totalRow.innerHTML = `
      <div class="unit">${data.length}</div>
      <div class="medal">${totalGold}</div>
      <div class="medal">${totalSilver}</div>
      <div class="medal">${totalBronze}</div>
      <div class="medal">${totalKL}</div>
    `;

    console.log("Bảng HC đã cập nhật");
  } catch (err) {
    console.log("Lỗi bảng HC", err);

    const medalTable = document.getElementById("medalTableBody");
    const totalRow = document.getElementById("medalTotalRow");
    if (medalTable) {
      medalTable.innerHTML = renderMedalRows([]);
    }
    if (totalRow) {
      totalRow.innerHTML = `
        <div class="unit">0</div>
        <div class="medal">0</div>
        <div class="medal">0</div>
        <div class="medal">0</div>
        <div class="medal">0</div>
      `;
    }
  }
}

function renderList(targetId, items, openFnName, emptyText) {
  const list = document.getElementById(targetId);
  if (!list) return;

  if (!items.length) {
    list.innerHTML = `<div class="doc-empty">${emptyText}</div>`;
    return;
  }

  list.innerHTML = items.map((item, index) => `
    <button class="doc-item-btn" onclick="${openFnName}(${index})">
      <div class="doc-item-title">${item.title}</div>
      <div class="doc-item-arrow">›</div>
    </button>
  `).join("");
}

<script>
function makeDraggable(selector){
  const el = document.querySelector(selector);
  if (!el) return;

  let dragging = false;
  let offsetX = 0;
  let offsetY = 0;

  el.addEventListener("pointerdown", function(e){
    dragging = true;
    el.setPointerCapture(e.pointerId);

    const rect = el.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;

    el.style.position = "fixed";
    el.style.left = rect.left + "px";
    el.style.top = rect.top + "px";
    el.style.right = "auto";
    el.style.bottom = "auto";
    el.style.cursor = "grabbing";
  });

  el.addEventListener("pointermove", function(e){
    if (!dragging) return;

    el.style.left = (e.clientX - offsetX) + "px";
    el.style.top = (e.clientY - offsetY) + "px";
  });

  el.addEventListener("pointerup", function(e){
  dragging = false;
  el.releasePointerCapture(e.pointerId);
  el.style.cursor = "grab";
});

}

makeDraggable(".floating-left");
makeDraggable(".floating-right");
</script>
