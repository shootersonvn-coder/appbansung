<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SFS Shooting</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header">
    <div class="logo-circle">sfs</div>
    <div class="title">SFS Shooting</div>
  </div>

  <div class="tabs">
    <div class="tab">sfs</div>
    <div class="tab">Giải đấu</div>
    <div class="tab">Tài liệu</div>
    <div class="tab">Tin tức</div>
  </div>

  <div class="banner-wrap">
    <div class="banner-main">Banner chính</div>
    <div class="banner-side">
      <div class="side-box">Video</div>
      <div class="side-box">Ảnh</div>
    </div>
  </div>

  <div class="medal-box">
    <div class="medal-head">
      <div>XH</div>
      <div>Đơn vị</div>
      <div>🥇</div>
      <div>🥈</div>
      <div>🥉</div>
      <div>💥</div>
      <div>Cộng</div>
    </div>

    <div class="medal-total">
      <div>10</div>
      <div>Tổng</div>
      <div>55</div>
      <div>55</div>
      <div>61</div>
      <div>10</div>
      <div>171</div>
    </div>

    <div class="medal-row">
      <div>1</div>
      <div>Hà Nội</div>
      <div>15</div>
      <div>17</div>
      <div>9</div>
      <div>3</div>
      <div>41</div>
    </div>

    <div class="medal-row">
      <div>2</div>
      <div>Quân đội</div>
      <div>15</div>
      <div>16</div>
      <div>19</div>
      <div>2</div>
      <div>50</div>
    </div>

    <div class="more">Xem thêm</div>
  </div>

  <div class="buttons">
    <button>Đã đăng ký thi đấu</button>
    <button>Danh sách thi đấu</button>
    <button>Thành viên tham dự</button>
    <button>Thành tích sơ bộ</button>
    <button>Thẻ thi đấu</button>
  </div>

  <div class="footer">
    © 2025 SFS Shooting – All rights reserved
  </div>

</body>
</html>
