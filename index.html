function splitCSVRow(row) {
  const result = [];
  let current = "";
  let insideQuotes = false;

  for (let i = 0; i < row.length; i++) {
    const char = row[i];
    const next = row[i + 1];

    if (char === '"') {
      if (insideQuotes && next === '"') {
        current += '"';
        i++;
      } else {
        insideQuotes = !insideQuotes;
      }
    } else if (char === "," && !insideQuotes) {
      result.push(current);
      current = "";
    } else {
      current += char;
    }
  }

  result.push(current);
  return result.map(v => v.trim());
}

function normalizeDriveImage(url) {
  if (!url) return "";

  const trimmed = url.trim();

  if (trimmed.includes("/file/d/")) {
    const match = trimmed.match(/\/d\/([^/]+)/);
    if (match && match[1]) {
      return "https://drive.google.com/thumbnail?id=" + match[1] + "&sz=w1600";
    }
  }

  if (trimmed.includes("drive.google.com") && trimmed.includes("id=")) {
    return trimmed;
  }

  return trimmed;
}

async function loadMainBanner() {
  try {
    const res = await fetch(latestBannerCSV, { cache: "no-store" });
    const text = await res.text();

    const firstLine = text.split(/\r?\n/)[0];
    const cols = splitCSVRow(firstLine);

    const rawURL = cols[27] || "";
    const finalURL = normalizeDriveImage(rawURL);

    const img = document.getElementById("main-banner-image");
    if (img && finalURL) {
      img.src = finalURL;
      img.onerror = function () {
        console.log("Banner load lỗi:", finalURL);
      };
    }

    console.log("AB1 raw =", rawURL);
    console.log("Banner final =", finalURL);
  } catch (e) {
    console.log("Lỗi banner", e);
  }
}

function openSingleLink(link) {
  if (!link || link.startsWith("LINK_")) return;
  window.location.href = link;
}

function renderList(targetId, items, openFnName, emptyText) {
  const list = document.getElementById(targetId);
  if (!list) return;

  if (!items.length) {
    list.innerHTML = `<div class="doc-empty">${emptyText}</div>`;
    return;
  }

  list.innerHTML = items.map((item, index) => `
    <button class="doc-item-btn" onclick="${openFnName}(${index})">
      <div class="doc-item-title">${item.title}</div>
      <div class="doc-item-arrow">›</div>
    </button>
  `).join("");
}

function openTaiLieuMenu() {
  const panel = document.getElementById("docsPanel");
  if (!panel) return;

  renderList("docsList", taiLieuLinks, "openTaiLieuLink", "Chưa có tài liệu.");
  panel.classList.add("show");
  panel.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}

function closeTaiLieuMenu() {
  const panel = document.getElementById("docsPanel");
  if (!panel) return;

  panel.classList.remove("show");
  panel.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
}

function openTaiLieuLink(index) {
  const item = taiLieuLinks[index];
  if (!item || !item.url || item.url.startsWith("LINK_")) return;
  window.location.href = item.url;
}

function openDangKyMenu() {
  const panel = document.getElementById("dangKyPanel");
  if (!panel) return;

  renderList("dangKyList", dangKyLinks, "openDangKyLink", "Chưa có link đăng ký.");
  panel.classList.add("show");
  panel.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}

function closeDangKyMenu() {
  const panel = document.getElementById("dangKyPanel");
  if (!panel) return;

  panel.classList.remove("show");
  panel.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
}

function openDangKyLink(index) {
  const item = dangKyLinks[index];
  if (!item || !item.url || item.url.startsWith("LINK_")) return;
  window.location.href = item.url;
}

loadMainBanner();
  </script>
</body>
