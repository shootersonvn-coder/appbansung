<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Luật</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">

<style>
body {
  margin: 0;
  font-family: "Roboto Condensed", Arial, sans-serif;
  background: #eef3fb;
}


.path{
  margin-top:75px;
  padding: 10px 14px;
  font-size: 14px;
  color: #555;
  background: #dfeaf5;
}

.list {
  padding: 12px;
}

.item {
  background: white;
  margin-bottom: 8px;
  padding: 12px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: bold;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.item-code {
  font-size: 14px;
  font-weight: 800;
  color: #000;
  margin-bottom: 4px;
}

.item-title {
  font-family: "Oswald", "Roboto Condensed", Arial, sans-serif;
  font-size: 14px;
  font-weight: 400;
  color: #000;
  line-height: 1.55;
  text-align: justify;
  text-indent: 3ch;
  white-space: pre-wrap;
}

.detail {
  background: white;
  margin: 12px;
  padding: 14px;
  border-radius: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.detail-code {
  font-size: 14px;
  font-weight: 800;
  color: #006b3c;
  margin-bottom: 8px;
}

.detail-title {
  font-family: "Oswald", "Roboto Condensed", Arial, sans-serif;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 12px;
}

.detail-content {
  font-family: "Oswald", "Roboto Condensed", Arial, sans-serif;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.55;
  text-align: justify;
  text-indent: 3ch;
  white-space: pre-wrap;
}

.status {
  padding: 14px;
  font-weight: bold;
}
.page-back-button{
  border:none;
  background:transparent;
  padding:0;
}
.law-link{
  color:#1565c0;
  text-decoration:underline;
  font-weight:600;
  word-break:break-word;
}
</style>
</head>

<body>

<header class="page-header">
  <div class="page-header-inner">

    <button class="page-back page-back-button" onclick="goBack()">
      ← Quay lại
    </button>

    <div class="page-title-wrap">
      <div class="page-title">Luật</div>
    </div>

  </div>
</header>

<div class="path" id="path">Đang tải...</div>
<div id="app"></div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/1oLxufg1IYuHXF4LtSsmme2nYvtMTNSAav8LgJzOGfWw/export?format=csv&gid=1953671499";

let allRows = [];
let stack = [];

function parseCSV(text) {
  const rows = [];
  let row = [];
  let cell = "";
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    const next = text[i + 1];

    if (ch === '"' && inQuotes && next === '"') {
      cell += '"';
      i++;
    } else if (ch === '"') {
      inQuotes = !inQuotes;
    } else if (ch === "," && !inQuotes) {
      row.push(cell);
      cell = "";
    } else if ((ch === "\n" || ch === "\r") && !inQuotes) {
      if (ch === "\r" && next === "\n") i++;
      row.push(cell);
      rows.push(row);
      row = [];
      cell = "";
    } else {
      cell += ch;
    }
  }

  if (cell !== "" || row.length > 0) {
    row.push(cell);
    rows.push(row);
  }

  return rows;
}

function compareRows(a, b) {
  const sa = Number(a.sort);
  const sb = Number(b.sort);

  if (!isNaN(sa) && !isNaN(sb) && sa !== sb) {
    return sa - sb;
  }

  return a.id.localeCompare(b.id, "vi", { numeric: true });
}

function escapeHTML(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}
function formatContent(text) {

  // escape trước
  let html = escapeHTML(text || "");

  // đổi markdown link thành thẻ a
  html = html.replace(
    /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" class="law-link">$1</a>'
  );


  return html
    .split(/\r?\n/)
    .filter(line => line.trim() !== "")
    .map(line => `<div class="content-line">${line}</div>`)
    .join("");
}

function loadData() {
  document.getElementById("path").textContent = "Đang tải...";
  document.getElementById("app").innerHTML = `<div class="status">Đang tải dữ liệu...</div>`;

  fetch(CSV_URL + "&t=" + Date.now())
    .then(res => res.text())
    .then(text => {
      const rows = parseCSV(text);

      allRows = rows.slice(1).map(c => ({
        id: (c[0] || "").trim(),
        parentId: (c[1] || "").trim(),
        title: (c[2] || "").trim(),
        content: (c[3] || "").trim(),
        sort: (c[4] || "").trim()
      })).filter(r => r.id);

      renderList("");
    })
    .catch(err => {
      console.error(err);
      document.getElementById("path").textContent = "Lỗi tải dữ liệu";
      document.getElementById("app").innerHTML = `<div class="status">Lỗi tải dữ liệu</div>`;
    });
}

function renderList(parentId) {
  const children = allRows
    .filter(r => r.parentId === parentId)
    .sort(compareRows);

  const app = document.getElementById("app");

  if (children.length === 0) {
    document.getElementById("path").textContent = "Danh mục luật";
    app.innerHTML = `<div class="status">Không có dữ liệu</div>`;
    return;
  }

  document.getElementById("path").textContent =
    stack.length === 0
      ? "Danh mục luật"
      : stack.map(x => `${x.id} ${x.title}`).join(" > ");

  app.innerHTML = `<div class="list"></div>`;
  const list = app.querySelector(".list");

  children.forEach(row => {
    const div = document.createElement("div");
    div.className = "item";

    if (stack.length === 0) {
      div.textContent = `${row.id} ${row.title}`;
    } else {
      div.innerHTML = `
        <div class="item-code">${escapeHTML(row.id)}</div>
        <div class="item-title">${escapeHTML(row.title)}</div>
      `;
    }

    div.onclick = () => openNode(row);
    list.appendChild(div);
  });

  window.scrollTo(0, 0);
}

function openNode(row) {
  stack.push(row);
  renderNode(row);
}

function renderNode(row) {
  const children = allRows
    .filter(r => r.parentId === row.id)
    .sort(compareRows);

  document.getElementById("path").textContent =
    stack.map(x => `${x.id} ${x.title}`).join(" > ");

  let html = "";

  if (row.content && row.content.trim() !== "") {
    const contentHTML = formatContent(row.content);
    html += `
      <div class="detail">
        <div class="detail-code">${escapeHTML(row.id)}</div>
        <div class="detail-title">${escapeHTML(row.title)}</div>
        <div class="detail-content">${contentHTML}</div>
      </div>
    `;
  }

  if (children.length > 0) {
    html += `<div class="list">`;

    children.forEach(child => {
      html += `
        <div class="item" onclick="openNodeById('${escapeHTML(child.id)}')">
          <div class="item-code">${escapeHTML(child.id)}</div>
          <div class="item-title">${escapeHTML(child.title)}</div>
        </div>
      `;
    });

    html += `</div>`;
  }

  document.getElementById("app").innerHTML = html || `
    <div class="status">Không có dữ liệu</div>
  `;

  window.scrollTo(0, 0);
}

function openNodeById(id) {
  const row = allRows.find(r => r.id === id);
  if (row) openNode(row);
}

function openDetail(row) {
  document.getElementById("path").textContent =
    stack.concat(row).map(x => `${x.id} ${x.title}`).join(" > ");

  const contentHTML = escapeHTML(row.content)
    .split(/\r?\n/)
    .filter(line => line.trim() !== "")
    .map(line => `<div class="content-line">${line}</div>`)
    .join("");

  document.getElementById("app").innerHTML = `
    <div class="detail">
      <div class="detail-code">${escapeHTML(row.id)}</div>
      <div class="detail-title">${escapeHTML(row.title)}</div>
      <div class="detail-content">${contentHTML}</div>
    </div>
  `;

  window.scrollTo(0, 0);
}

function goBack() {
  if (stack.length > 1) {
    stack.pop();
    renderNode(stack[stack.length - 1]);
    return;
  }

  if (stack.length === 1) {
    stack.pop();
    renderList("");
    return;
  }

  history.back();
}

loadData();
</script>
