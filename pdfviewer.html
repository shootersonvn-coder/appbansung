<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PDF Viewer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #eef3fb;
      --green-dark: #0b5d2a;
      --line: #d8dde5;
      --white: #ffffff;
      --text-main: #111111;
      --text-soft: rgba(255,255,255,0.88);
      --footer-h: 74px;
      --font-main: "Roboto Condensed", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      font-family: var(--font-main);
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: var(--green-dark);
      color: var(--white);
      padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 14px;
      flex: 0 0 auto;
    }

    .back {
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
      width: fit-content;
      color: var(--white);
      cursor: pointer;
      user-select: none;
      margin-bottom: 8px;
      padding: 0;
      border: none;
      background: transparent;
      appearance: none;
      -webkit-appearance: none;
      box-shadow: none;
      border-radius: 0;
    }

    .title-main {
      font-size: 16px;
      font-weight: 500;
      line-height: 1.2;
      word-break: break-word;
      color: var(--white);
    }

    .title-sub {
      font-size: 13px;
      font-weight: 800;
      line-height: 1.2;
      margin-top: 4px;
      word-break: break-word;
      color: var(--text-soft);
    }

    .viewer-wrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      background: #fff;
      overflow: hidden;
    }

    .message-box {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: #fff;
      color: #4b5563;
      font-size: 16px;
      font-weight: 600;
      z-index: 2;
      flex-direction: column;
      gap: 16px;
    }

    .open-btn {
      border: none;
      border-radius: 14px;
      background: linear-gradient(180deg, #0b7f3b 0%, #005f37 100%);
      color: white;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .bottom-bar {
      flex: 0 0 auto;
      height: calc(var(--footer-h) + env(safe-area-inset-bottom, 0px));
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
      background: #fff;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 12px;
    }

 .bottom-btn {
  flex: 1;
  border: none;
  border-radius: 16px;
  background: linear-gradient(180deg, #0b7f3b 0%, #005f37 100%);
  color: #fff;
  font-size: 16px;   /* ✅ giảm thêm */
  font-weight: 700;
  cursor: pointer;
  line-height: 1;
}
    @media (min-width: 768px) {
      .header {
        padding: calc(env(safe-area-inset-top, 0px) + 18px) 24px 18px;
      }

      .back {
        font-size: 16px;
        margin-bottom: 10px;
      }

      .title-main {
        font-size: 16px;
      }

      .title-sub {
        font-size: 16px;
        margin-top: 6px;
      }

      .open-btn {
        font-size: 16px;
        border-radius: 16px;
        padding: 14px 22px;
      }

      .bottom-btn {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <header class="header">
    <button class="back" type="button" onclick="history.back()">&lt;</button>
    <div class="title-main" id="pageTitle">PDF</div>
    <div class="title-sub">Tài liệu giải đấu</div>
  </header>

  <main class="viewer-wrap">
    <div class="message-box" id="messageBox">
      <div>Đang mở tài liệu...</div>
      <button class="open-btn" type="button" id="openDirectBtn">Mở trực tiếp</button>
    </div>
  </main>

  <footer class="bottom-bar">
    <button class="bottom-btn" type="button" id="shareBtn">Gửi</button>
    <button class="bottom-btn" type="button" id="downloadBtn">Tải về</button>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const title = params.get("title") || "PDF";
    const pdfUrl = params.get("url") || "";

    document.getElementById("pageTitle").textContent = title;

    const openDirectBtn = document.getElementById("openDirectBtn");
    const shareBtn = document.getElementById("shareBtn");
    const downloadBtn = document.getElementById("downloadBtn");

    function openDirect() {
      if (!pdfUrl) return;
      window.location.href = pdfUrl;
    }

    openDirectBtn.onclick = openDirect;

    shareBtn.onclick = async () => {
      if (!pdfUrl) return;

      try {
        if (navigator.share) {
          await navigator.share({
            title: title,
            url: pdfUrl
          });
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(pdfUrl);
          alert("Đã sao chép link tài liệu");
        }
      } catch (e) {}
    };

    downloadBtn.onclick = () => {
      if (!pdfUrl) return;
      window.open(pdfUrl, "_blank");
    };

    if (pdfUrl) {
      setTimeout(() => {
        openDirect();
      }, 250);
    }
  </script>

</body>
</html>
